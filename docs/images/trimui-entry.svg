<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1780" viewBox="0 0 1400 1780"><title>TrimUI Smart Pro S開啟監控面板</title><desc>實機截圖與去背機身的操作圖解。所有標註均為本專案監控功能。</desc><style>text{font-family:"Noto Sans CJK TC",sans-serif}</style><rect width="100%" height="100%" fill="#f7f9fc"/><text x="45" y="64" font-size="39" fill="#243448" font-weight="700">TrimUI Smart Pro S｜從遊戲選單進入監控</text><text x="45" y="109" font-size="24" fill="#243448" font-weight="400">先完成安裝。下列選單與監控頁均取自對應實機；機身為去背合成示意。</text><circle cx="70" cy="180" r="23" fill="#1266d6" stroke="white" stroke-width="3"/><text x="62" y="189" font-size="27" fill="white" font-weight="700">1</text><text x="110" y="190" font-size="32" fill="#243448" font-weight="700">用上緣 L／R 切到「應用」Apps</text><image href="trimui-smart-pro-s-cutout.png" x="35" y="320" width="550" height="207" preserveAspectRatio="none"/><rect x="147.2" y="344.84" width="324.5" height="157.32" fill="#111"/><image href="trimui-apps-tab.png" x="147.2" y="344.84" width="324.5" height="157.32" preserveAspectRatio="none"/><image href="trimui-apps-tab.png" x="610" y="235" width="720" height="405" preserveAspectRatio="none"/><rect x="962.8" y="239.05" width="43.199999999999996" height="34.425000000000004" rx="8" fill="none" stroke="#ffdf37" stroke-width="7"/><text x="45" y="682" font-size="27" fill="#1266d6" font-weight="700">先切到原廠「應用」分類，再找監控圖示</text><circle cx="70" cy="720" r="23" fill="#1266d6" stroke="white" stroke-width="3"/><text x="62" y="729" font-size="27" fill="white" font-weight="700">2</text><text x="110" y="730" font-size="32" fill="#243448" font-weight="700">選笑臉晶片 Hardware Monitor</text><image href="trimui-smart-pro-s-cutout.png" x="35" y="860" width="550" height="207" preserveAspectRatio="none"/><rect x="147.2" y="884.84" width="324.5" height="157.32" fill="#111"/><image href="trimui-app-monitor.png" x="147.2" y="884.84" width="324.5" height="157.32" preserveAspectRatio="none"/><image href="trimui-app-monitor.png" x="610" y="775" width="720" height="405" preserveAspectRatio="none"/><rect x="1135.6" y="908.65" width="183.6" height="186.3" rx="8" fill="none" stroke="#ffdf37" stroke-width="7"/><text x="45" y="1222" font-size="27" fill="#1266d6" font-weight="700">方向鍵選圖示，再按 A</text><circle cx="70" cy="1260" r="23" fill="#1266d6" stroke="white" stroke-width="3"/><text x="62" y="1269" font-size="27" fill="white" font-weight="700">3</text><text x="110" y="1270" font-size="32" fill="#243448" font-weight="700">進入監控總覽</text><image href="trimui-smart-pro-s-cutout.png" x="35" y="1400" width="550" height="207" preserveAspectRatio="none"/><rect x="147.2" y="1424.84" width="324.5" height="157.32" fill="#111"/><image href="trimui-dashboard.png" x="147.2" y="1424.84" width="324.5" height="157.32" preserveAspectRatio="none"/><image href="trimui-dashboard.png" x="610" y="1315" width="720" height="405" preserveAspectRatio="none"/><text x="45" y="1762" font-size="27" fill="#1266d6" font-weight="700">方向鍵選電腦，按 A 查看詳細頁</text></svg>