<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1220" viewBox="0 0 1500 1220"><title>TrimUI Smart Pro S按鍵操作</title><desc>實機截圖與去背機身的操作圖解。所有標註均為本專案監控功能。</desc><style>text{font-family:"Noto Sans CJK TC",sans-serif}</style><rect width="100%" height="100%" fill="#f7f9fc"/><text x="50" y="67" font-size="42" fill="#243448" font-weight="700">TrimUI Smart Pro S｜監控按鍵圖</text><text x="50" y="115" font-size="26" fill="#243448" font-weight="400">進入 Hardware Monitor 後，依圖上的編號操作。</text><image href="trimui-smart-pro-s-cutout.png" x="105" y="220" width="1290" height="486" preserveAspectRatio="none"/><text x="269.3" y="187" font-size="26" fill="#243448" font-weight="700">L／L1 肩鍵</text><path d="M324.3,198 V235" stroke="#47627c" stroke-width="4"/><circle cx="324.3" cy="235" r="9" fill="#47627c"/><text x="1120.7" y="187" font-size="26" fill="#243448" font-weight="700">R／R1 肩鍵</text><path d="M1175.7,198 V235" stroke="#47627c" stroke-width="4"/><circle cx="1175.7" cy="235" r="9" fill="#47627c"/><rect x="368.15999999999997" y="278.32" width="761.0999999999999" height="369.36" fill="#101825"/><image href="trimui-dashboard.png" x="368.15999999999997" y="278.32" width="761.0999999999999" height="369.36" preserveAspectRatio="none"/><circle cx="246.9" cy="390.1" r="24" fill="none" stroke="#1266d6" stroke-width="5"/><path d="M246.9,390.1 l-35,-26" stroke="#1266d6" stroke-width="3"/><circle cx="211.9" cy="364.1" r="23" fill="#1266d6" stroke="white" stroke-width="3"/><text x="203.9" y="373.1" font-size="27" fill="white" font-weight="700">1</text><circle cx="266.25" cy="545.62" r="24" fill="none" stroke="#1266d6" stroke-width="5"/><path d="M266.25,545.62 l-35,-26" stroke="#1266d6" stroke-width="3"/><circle cx="231.25" cy="519.62" r="23" fill="#1266d6" stroke="white" stroke-width="3"/><text x="223.25" y="528.62" font-size="27" fill="white" font-weight="700">1</text><circle cx="1233.75" cy="545.62" r="24" fill="none" stroke="#1266d6" stroke-width="5"/><path d="M1233.75,545.62 l-35,-26" stroke="#1266d6" stroke-width="3"/><circle cx="1198.75" cy="519.62" r="23" fill="#1266d6" stroke="white" stroke-width="3"/><text x="1190.75" y="528.62" font-size="27" fill="white" font-weight="700">1</text><circle cx="1286.64" cy="390.1" r="24" fill="none" stroke="#167c5a" stroke-width="5"/><path d="M1286.64,390.1 l36,-10" stroke="#167c5a" stroke-width="3"/><circle cx="1322.64" cy="380.1" r="23" fill="#167c5a" stroke="white" stroke-width="3"/><text x="1314.64" y="389.1" font-size="27" fill="white" font-weight="700">2</text><circle cx="1240.2" cy="433.84000000000003" r="24" fill="none" stroke="#a44919" stroke-width="5"/><path d="M1240.2,433.84000000000003 l34,24" stroke="#a44919" stroke-width="3"/><circle cx="1274.2" cy="457.84000000000003" r="23" fill="#a44919" stroke="white" stroke-width="3"/><text x="1266.2" y="466.84000000000003" font-size="27" fill="white" font-weight="700">3</text><circle cx="1241.49" cy="343.93" r="24" fill="none" stroke="#8a43c6" stroke-width="5"/><path d="M1241.49,343.93 l15,-40" stroke="#8a43c6" stroke-width="3"/><circle cx="1256.49" cy="303.93" r="23" fill="#8a43c6" stroke="white" stroke-width="3"/><text x="1248.49" y="312.93" font-size="27" fill="white" font-weight="700">4</text><circle cx="1245.36" cy="633.0999999999999" r="24" fill="none" stroke="#176c7d" stroke-width="5"/><path d="M1245.36,633.0999999999999 l28,35" stroke="#176c7d" stroke-width="3"/><circle cx="1273.36" cy="668.0999999999999" r="23" fill="#176c7d" stroke="white" stroke-width="3"/><text x="1265.36" y="677.0999999999999" font-size="27" fill="white" font-weight="700">5</text><circle cx="1187.31" cy="633.0999999999999" r="24" fill="none" stroke="#c02e4e" stroke-width="5"/><path d="M1187.31,633.0999999999999 l-28,35" stroke="#c02e4e" stroke-width="3"/><circle cx="1159.31" cy="668.0999999999999" r="23" fill="#c02e4e" stroke="white" stroke-width="3"/><text x="1151.31" y="677.0999999999999" font-size="27" fill="white" font-weight="700">6</text><rect x="55" y="756" width="670" height="96" rx="14" fill="white" stroke="#d6deea"/><circle cx="90" cy="796" r="23" fill="#1266d6" stroke="white" stroke-width="3"/><text x="82" y="805" font-size="27" fill="white" font-weight="700">1</text><text x="130" y="792" font-size="29" fill="#243448" font-weight="700">方向鍵／搖桿</text><text x="130" y="829" font-size="24" fill="#243448" font-weight="400">方向鍵／左：導覽；右：90° 旋轉</text><rect x="780" y="756" width="670" height="96" rx="14" fill="white" stroke="#d6deea"/><circle cx="815" cy="796" r="23" fill="#167c5a" stroke="white" stroke-width="3"/><text x="807" y="805" font-size="27" fill="white" font-weight="700">2</text><text x="855" y="792" font-size="29" fill="#243448" font-weight="700">A｜開啟詳細頁</text><text x="855" y="829" font-size="24" fill="#243448" font-weight="400">再按一次，查看選定資訊卡</text><rect x="55" y="864" width="670" height="96" rx="14" fill="white" stroke="#d6deea"/><circle cx="90" cy="904" r="23" fill="#a44919" stroke="white" stroke-width="3"/><text x="82" y="913" font-size="27" fill="white" font-weight="700">3</text><text x="130" y="900" font-size="29" fill="#243448" font-weight="700">B｜返回</text><text x="130" y="937" font-size="24" fill="#243448" font-weight="400">單項頁 → 詳細頁 → 總覽</text><rect x="780" y="864" width="670" height="96" rx="14" fill="white" stroke="#d6deea"/><circle cx="815" cy="904" r="23" fill="#8a43c6" stroke="white" stroke-width="3"/><text x="807" y="913" font-size="27" fill="white" font-weight="700">4</text><text x="855" y="900" font-size="29" fill="#243448" font-weight="700">X｜關屏／喚醒</text><text x="855" y="937" font-size="24" fill="#243448" font-weight="400">再按 X 恢復；MQTT 持續接收</text><rect x="55" y="972" width="670" height="96" rx="14" fill="white" stroke="#d6deea"/><circle cx="90" cy="1012" r="23" fill="#176c7d" stroke="white" stroke-width="3"/><text x="82" y="1021" font-size="27" fill="white" font-weight="700">5</text><text x="130" y="1008" font-size="29" fill="#243448" font-weight="700">Start｜輪播</text><text x="130" y="1045" font-size="24" fill="#243448" font-weight="400">在總覽暫停或恢復輪播</text><rect x="780" y="972" width="670" height="96" rx="14" fill="white" stroke="#d6deea"/><circle cx="815" cy="1012" r="23" fill="#c02e4e" stroke="white" stroke-width="3"/><text x="807" y="1021" font-size="27" fill="white" font-weight="700">6</text><text x="855" y="1008" font-size="29" fill="#243448" font-weight="700">Select + Start｜退出</text><text x="855" y="1045" font-size="24" fill="#243448" font-weight="400">同時按住，回到原廠選單</text><text x="55" y="1140" font-size="26" fill="#243448" font-weight="700">L1／R1（上緣／機背肩鍵）：總覽翻頁；詳細頁切換上一台／下一台。</text><text x="55" y="1184" font-size="23" fill="#607085" font-weight="400">機身為商品照片去背示意，螢幕嵌入實機截圖；不代表原廠內建此功能。</text></svg>