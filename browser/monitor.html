.detail-grid>[data-section]{cursor:pointer}.detail-grid>.panel.selected{outline:4px solid #cb8e16;outline-offset:-7px}.detail-grid>[data-section]:focus-visible{outline:4px solid #9860bd;outline-offset:-7px}.focus-grid{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;padding:0 5px 5px 0}.focus-grid .panel{padding:18px}.focus-grid h3{font-size:23px;line-height:30px}.focus-grid .gauge{width:148px;height:148px}.focus-grid .sensor{font-size:18px;line-height:27px}.focus-grid .core{font-size:19px}.focus-grid .cores{gap:18px}.focus-grid .core .track{height:16px}.focus-grid .big{font-size:32px}.focus-grid .focus-chart svg{height:145px;width:100%;background:#f0f6f2;margin-top:14px;border-bottom:2px solid #a6b8ae}.focus-grid .mini-label{font-size:16px}.focus-full{grid-column:1/-1}.focus-gpus{height:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:14px;padding:0 5px 5px 0}.focus-gpus .panel{padding:18px}.focus-gpus .gpu-card{margin:0;border:0;padding:0}.focus-gpus .gpu-name{font-size:20px;margin-bottom:10px}.focus-gpus .gauge{width:105px;height:105px}.focus-gpus .sensor{font-size:16px;line-height:26px}.focus-gpus .gpu-card .track{height:13px}.focus-gpus .focus-chart svg{width:100%;height:145px;margin-top:10px;background:#fff8fb}.focus-list{height:100%;display:grid;grid-template-rows:auto auto 1fr;gap:12px;padding:0 5px 5px 0}.focus-list>.panel:first-child h3{font-size:25px}.focus-list .io-totals strong{font-size:25px}.focus-list .io-totals small{font-size:17px}.focus-list .graphs-pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.focus-list .graphs-pair svg{width:100%;height:65px;margin-top:8px;background:#eef5f0}.item-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:10px;min-height:0}.item-card{border:2px solid var(--ink);background:var(--paper);border-radius:12px;padding:8px 10px;min-width:0;min-height:0}.item-card h4{font-size:14px;margin:0 0 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item-card .sensor{font-size:12px;line-height:19px}.item-card .track{height:7px;margin-top:2px}.focus-activity{height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(0,1fr);gap:14px;padding:0 5px 5px 0}.focus-activity svg{width:100%;height:130px;margin-top:16px;background:#eff5f0}.focus-activity strong{font-size:24px;display:block}.focus-activity h3{font-size:18px}
.focus-gpus.single{grid-template-columns:1fr}.focus-gpus.compact .gauge{width:76px;height:76px}.focus-gpus.compact .gpu-name{font-size:16px;margin-bottom:5px}.focus-gpus.compact .sensor{font-size:13px;line-height:20px}.focus-gpus.compact .focus-chart svg{height:38px;margin-top:4px}.focus-gpus.compact .focus-chart small{font-size:12px}
@media(prefers-reduced-motion:no-preference){article.selected:before{animation:pop .12s ease-out}@keyframes pop{from{transform:translate(-5px,-50%)}to{transform:translate(0,-50%)}}}

/* Distance view: five primary readings; fine detail stays one level deeper. */
.detail-grid.distance-detail{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:1fr .95fr 76px;gap:14px}
.distance-detail>.usage-panel{grid-column:span 2;padding:16px 18px}
.distance-detail>.flow-panel,.distance-detail>.detail-shortcut{grid-column:span 3}
.distance-detail .panel h3{font-size:28px;line-height:34px;margin-bottom:10px}
.distance-detail .tag{font-size:17px;line-height:24px}
.distance-detail .reading{display:block;font-size:64px;line-height:1.15;font-weight:900;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin:8px 0 12px}
.distance-detail .track{height:18px;border-radius:9px;margin:0 0 10px}
.distance-detail .reading-note{font-size:23px;line-height:30px;font-weight:bold}
.distance-detail .reading-meta{font-size:23px;line-height:30px}
.distance-detail .flow-panel{padding:16px 18px;background:#fff8d8}
.distance-detail .flow-panel:nth-child(5){background:#e6f5ff}
.distance-detail .flow-row{display:grid;grid-template-columns:110px minmax(0,1fr) 78px;align-items:baseline;gap:8px;margin-top:18px}
.distance-detail .flow-row>span:first-child{font-size:24px;font-weight:bold;white-space:nowrap}
.distance-detail .flow-value{font-size:48px;line-height:1.2;text-align:right;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.distance-detail .flow-unit{font-size:23px}
.distance-detail .detail-shortcut{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px}
.distance-detail .detail-shortcut h3{font-size:19px;line-height:24px;margin:0;white-space:nowrap}
.distance-detail .detail-shortcut>span{font-size:21px;line-height:26px}
body.device-summary h1{font-size:36px}
body.device-summary #summary{font-size:19px}

@media (min-width:900px) and (max-height:740px){
 .distance-detail>.usage-panel{padding:10px 16px}
 .distance-detail .panel h3{font-size:26px;line-height:30px;margin-bottom:4px}
 .distance-detail .reading{line-height:1.05;margin:4px 0 6px}
 .distance-detail .track{height:14px;margin-bottom:6px}
 .distance-detail .reading-note,.distance-detail .reading-meta{font-size:20px;line-height:24px}
}

.distance-detail .gpu-readings{height:calc(100% - 44px);display:grid;grid-template-rows:repeat(var(--gpu-count),minmax(0,1fr));gap:8px}
.distance-detail .gpu-reading{min-height:0;display:flex;flex-direction:column;justify-content:center}
.distance-detail .gpu-reading+.gpu-reading{border-top:1px solid #cda8b7}
.distance-detail .gpu-load{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.distance-detail .gpu-load>span{font-size:23px;font-weight:bold;white-space:nowrap}
.distance-detail .gpu-load .reading{font-size:44px;margin:0;letter-spacing:-1.5px}
.distance-detail .gpu-vram{font-size:20px;line-height:25px;white-space:nowrap}
.distance-detail .gpu-readings[style="--gpu-count:1"] .reading{font-size:64px}
.distance-detail .many-gpus{gap:2px}
.distance-detail .many-gpus .gpu-reading{flex-direction:row;align-items:center;justify-content:space-between;gap:6px}
.distance-detail .many-gpus .gpu-load{flex:1}
.distance-detail .many-gpus .gpu-load>span{font-size:18px}
.distance-detail .many-gpus .reading{font-size:30px}
.distance-detail .many-gpus .gpu-vram{font-size:15px}

.overview-grid article{grid-template-columns:220px minmax(0,1fr);gap:12px}
.overview-grid h2{font-size:30px;line-height:36px}
.overview-grid .host-title img{width:48px;height:48px}
.overview-grid .host-caption{font-size:18px;line-height:26px}
.overview-grid .metrics{gap:12px}
.overview-grid .metric small{font-size:20px;line-height:25px}
.overview-grid .metric strong{font-size:36px;line-height:42px;margin:5px 0}
.overview-grid .metric .vram{font-size:18px;line-height:23px;white-space:normal}
.overview-grid .temperature-pair strong{font-size:27px;line-height:34px}
.overview-gpu-row{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.overview-gpu-row>span{font-size:18px;white-space:nowrap}
.overview-grid .overview-gpu-row strong{font-size:26px;line-height:31px;margin:0}
body:not(.device-summary) #summary{font-size:19px}
.overview-grid .overview-gpu-many .overview-gpu-row strong{font-size:22px;line-height:26px}

header>div{max-width:360px;min-width:0}
header h1,body.device-summary h1{max-width:360px;font-size:30px}
#device-status{position:absolute;top:16px;right:20px;width:520px;height:62px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#device-status>div{background:#fffef4;border:2px solid var(--ink);border-radius:10px;padding:4px 8px;min-width:0}
#device-status small{display:block;font-size:15px;line-height:19px;font-weight:bold;white-space:nowrap}
#device-status strong{display:block;font-size:27px;line-height:30px;font-weight:bold;font-variant-numeric:tabular-nums}
#local-battery-box.powered{background:var(--yellow)}
#charge-icon svg{width:15px;height:16px;vertical-align:-2px}
#connection{position:absolute;top:81px;right:20px;font-size:14px;padding:4px 10px}
#summary{max-width:calc(100% - 230px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.focus-grid h3,.focus-list>.panel:first-child h3{font-size:28px;line-height:34px}
.focus-grid .gauge{width:170px;height:170px}
.focus-grid .gauge text,.focus-gpus .gauge text{font-size:28px}
.focus-grid .sensor{font-size:24px;line-height:32px}
.focus-grid .core{font-size:26px;line-height:32px}
.focus-grid .big{font-size:36px;line-height:42px}
.focus-grid .mini-label{font-size:22px;line-height:28px}
.focus-grid .tag{font-size:20px}
.focus-grid .history-note{font-size:17px}
.focus-grid .focus-chart svg{height:155px;margin-top:10px}
.gpu-focus-page{height:100%;display:grid;grid-template-rows:40px minmax(0,1fr);gap:10px}
.gpu-page-heading{font-size:26px;line-height:34px;display:flex;justify-content:space-between;align-items:center}
.item-pager{font-size:20px;white-space:nowrap;float:right}
.item-pager button{font-size:20px;padding:0 8px;line-height:27px}
.item-pager button:disabled{opacity:.4;cursor:default}
.focus-gpus .gpu-name{font-size:26px;line-height:32px;margin-bottom:10px}
.focus-gpus .gauge{width:138px;height:138px}
.focus-gpus .sensor{font-size:24px;line-height:32px}
.focus-gpus .focus-chart small{font-size:21px;line-height:28px}
.focus-gpus .focus-chart svg{height:115px;margin-top:8px}
@media (min-width:900px) and (max-height:740px){
 .focus-gpus .focus-chart svg{height:95px}
}
.focus-list{grid-template-rows:170px 100px minmax(0,1fr)}
.focus-list>.panel{padding:10px 14px}
.focus-list .io-totals strong{font-size:38px;line-height:44px;margin:2px 0 4px}
.focus-list .io-totals small,.focus-list .mini-label{font-size:20px;line-height:26px}
.focus-list .big{font-size:38px;line-height:44px;margin:3px 0}
.focus-list .graphs-pair{font-size:22px;line-height:28px}
.focus-list .graphs-pair svg{height:43px;margin-top:6px}
.item-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.item-card h4{font-size:24px;line-height:28px;margin-bottom:5px}
.item-card .sensor{font-size:22px;line-height:28px}
.item-card .track{height:9px;margin-top:2px}
.item-card .item-extra{font-size:18px;line-height:22px}
.focus-activity h3{font-size:24px;line-height:30px}
.focus-activity strong{font-size:32px;line-height:38px}
.focus-activity small{font-size:18px;line-height:24px}
.focus-activity svg{height:115px;margin-top:12px}
@media (min-width:900px) and (max-height:740px){
 .item-card{padding:4px 10px}
 .item-card h4{font-size:20px;line-height:24px;margin-bottom:3px}
 .item-card .sensor{font-size:20px;line-height:24px}
 .item-card .item-extra{font-size:16px;line-height:18px}
}
.pve-list{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:18px 20px}.pve-list h2{font-size:28px;display:flex;justify-content:space-between;align-items:center}.pve-list h2 .tag{font-size:18px}.pve-rows{display:grid;grid-auto-rows:minmax(0,1fr);gap:9px;min-height:0}.pve-row{display:grid;grid-template-columns:100px minmax(120px,1fr) 130px 150px;grid-template-rows:minmax(0,1fr) auto;align-items:center;gap:4px 12px;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;background:#e6f5ff;font-size:18px;min-width:0}.pve-row.selected{background:#fff1b7;outline:3px solid #cb8e16}.pve-row>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pve-row .pve-memory{grid-column:1/-1;overflow:visible;text-overflow:clip}.distance-detail.pve-enabled>.detail-shortcut,.distance-detail.pve-enabled>.pve-entry{grid-column:span 2}.distance-detail .pve-entry{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}.distance-detail .pve-entry.selected{outline:4px solid #cb8e16;outline-offset:-7px}.distance-detail.pve-enabled>.detail-shortcut,.distance-detail.pve-enabled>.pve-entry{padding:6px 9px}.distance-detail.pve-enabled>.detail-shortcut h3,.distance-detail.pve-enabled>.pve-entry h3{font-size:16px;line-height:20px;margin:0}.distance-detail.pve-enabled>.detail-shortcut>span,.distance-detail.pve-enabled>.pve-entry>span{font-size:15px;line-height:18px}
.pve-detail{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px;padding:14px 18px}.pve-detail h2{font-size:22px;display:flex;justify-content:space-between;gap:8px;min-width:0}.pve-detail h2 .pve-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pve-detail h2 .tag{flex:none;font-size:15px}.pve-readings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.pve-reading{min-width:0;padding:7px 9px;border:2px solid var(--ink);border-radius:9px;background:#e6f5ff}.pve-reading small,.pve-trend small{display:block;font-size:13px;font-weight:bold}.pve-reading strong{display:block;font-size:19px;margin-top:4px;white-space:nowrap}.pve-reading.pve-memory-reading{grid-column:1/-1}.pve-trends{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;min-height:0}.pve-trend{min-width:0;padding:6px 8px;border:1px solid #becbc6;border-radius:8px;background:#edf2ef}.pve-trend svg{width:100%;height:calc(100% - 20px);min-height:35px;display:block}
/* Guest details keep distance-readable values above compact trends. */
.pve-row{grid-template-columns:175px minmax(120px,1fr) 115px 230px;font-size:24px}
.pve-row>strong{font-size:26px}
.pve-row>:nth-child(4){font-size:30px;font-weight:900}
.pve-row .pve-memory{font-size:26px;font-weight:bold}
.pve-detail{grid-template-rows:auto minmax(0,1fr) 112px}
.pve-readings{gap:10px;grid-template-rows:1.2fr 1fr 1fr;min-height:0}
.pve-reading{display:flex;flex-direction:column;justify-content:center;padding:8px 12px}
.pve-reading:nth-child(-n+2){grid-column:span 2}
.pve-reading small{font-size:18px;line-height:24px}
.pve-reading strong{font-size:32px;line-height:1.15;white-space:normal;font-variant-numeric:tabular-nums}
.pve-reading:nth-child(-n+2) strong{font-size:64px}
.pve-trends{gap:6px}
.pve-trend{padding:3px 7px}
.pve-trend small{font-size:12px;line-height:15px}
.pve-trend svg{height:calc(100% - 15px);min-height:0}
</style>
<header><img src="/assets/hardware-buddy.svg" alt="Smiling chip mascot"><div><div class="brand-note">Hardware buddies</div><h1 id="title">Hardware Monitor</h1></div><aside id="device-status" aria-label="R36 handheld status"><div><small>R36 Temp</small><strong id="local-temp">—</strong></div><div><small>R36 CPU</small><strong id="local-cpu">—</strong></div><div><small>R36 RAM</small><strong id="local-memory">—</strong></div><div id="local-battery-box"><small>Battery <span id="charge-icon"></span></small><strong id="local-battery">—</strong></div></aside><span id="connection">Connecting…</span></header>
<div id="summary"></div><main id="main"></main>
<footer><span id="help"><kbd>Stick / D-pad</kbd> Select <kbd>A</kbd> Details <kbd>B</kbd> Back</span><span><button onclick="control('previous')">L1 Previous</button> <button onclick="control('next')">R1 Next</button> <button onclick="control('toggle')">Start Pause / resume</button></span><span><button id="screen-button" onclick="control('screen')" aria-label="Turn screen off; press FN to wake">FN Screen off</button> <kbd id="exit-keys">Select + B</kbd> Exit</span></footer>
<script src="/pve.js"></script><script>
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numeric=v=>typeof v==='number'&&Number.isFinite(v);
const fmt=(v,suffix='')=>numeric(v)?v.toFixed(1)+suffix:'—';
const bytes=v=>numeric(v)?(v/1073741824).toFixed(1)+' GiB':'—';
const rate=v=>numeric(v)?(v/1048576).toFixed(2)+' MiB/s':'—';
function graph(history,key,color,limit=100){
 const values=history.map(x=>x[key]),valid=values.filter(numeric),top=limit??Math.max(1,...valid);
 let segments=[],points=[];
 values.forEach((v,i)=>{if(numeric(v)){points.push(`${i*240/Math.max(1,values.length-1)},${60-Math.min(top,Math.max(0,v))/top*60}`)}else if(points.length){segments.push(points.join(' '));points=[]}});
 if(points.length)segments.push(points.join(' '));
 return `<svg viewBox="0 0 240 62" preserveAspectRatio="none" aria-label="${esc(key)} recent history">${segments.map(p=>`<polyline points="${p}" fill="none" stroke="${color}" stroke-width="2"/>`).join('')}</svg>`;
}
function vram(g){
 if(numeric(g.memory_total_mb)&&g.memory_total_mb>0&&numeric(g.memory_used_mb)&&g.memory_used_mb>=0)return `${(g.memory_used_mb/1024).toFixed(1)} / ${(g.memory_total_mb/1024).toFixed(1)} GiB`;
 if(g.memory_total_mb===0)return '—';
 return fmt(g.memory_percent,'%');
}
function vramPercent(g){if(g.memory_total_mb===0)return '—';return numeric(g.memory_percent)?fmt(g.memory_percent,'%'):(numeric(g.memory_used_mb)&&numeric(g.memory_total_mb)&&g.memory_total_mb>0?fmt(g.memory_used_mb/g.memory_total_mb*100,'%'):'—')}
function mainVram(gpus){return gpus.filter(g=>numeric(g.memory_total_mb)&&g.memory_total_mb>0).sort((a,b)=>(b.memory_used_mb??0)-(a.memory_used_mb??0))[0]??gpus.find(g=>numeric(g.memory_percent))??{}}

function bar(value,color,max=100){const width=numeric(value)?Math.min(100,Math.max(0,value/max*100)):0;return `<div class="track" style="--color:${color}"><div class="fill" style="width:${width}%"></div></div>`}
function gauge(value,color,label){let percent=numeric(value)?Math.min(100,Math.max(0,value)):0;return `<svg class="gauge" viewBox="0 0 120 120" role="img" aria-label="${esc(label)} ${fmt(value,'%')}"><circle cx="60" cy="60" r="48" fill="#fffef4" stroke="#243449" stroke-width="13"/><circle cx="60" cy="60" r="48" fill="none" stroke="${color}" stroke-width="9" pathLength="100" stroke-dasharray="${percent} 100" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle">${numeric(value)&&value>=100?'100%':fmt(value,'%')}</text></svg>`}
function temperature(value,label='Temperature'){return `<div class="sensor">${esc(label)} ${fmt(value,'°C')}${bar(value,'#ffe071',100)}</div>`}
function busiest(cores){return cores.map((value,index)=>({value,index})).filter(c=>numeric(c.value)).sort((a,b)=>b.value-a.value||a.index-b.index).slice(0,4)}
function gpuCard(g,i){let used=g.memory_total_mb===0?null:(numeric(g.memory_percent)?g.memory_percent:(numeric(g.memory_used_mb)&&numeric(g.memory_total_mb)&&g.memory_total_mb>0?g.memory_used_mb/g.memory_total_mb*100:null));return `<div class="gpu-card"><div class="gpu-name">${esc(g.name??g.product_name??`GPU ${i+1}`)}</div><div class="instrument">${gauge(g.usage_percent,'#ff9fbb','GPU load')}<div>${temperature(g.temperature_celsius)}<div class="sensor">VRAM ${vram(g)} · ${vramPercent(g)}${bar(used,'#ff9fbb')}</div></div></div></div>`}
function metric(label,value,history,key,color){return `<div class="metric"><small>${label}</small><strong>${value}</strong>${graph(history,key,color)}</div>`}
function overview(host,selected){let m=host.metrics,h=host.history,v=host.virtualization;return `<article data-host="${esc(host.host)}" class="${host.host===selected?'selected':''}"><div class="host-title"><img src="/assets/hardware-buddy.svg" alt=""><div style="min-width:0"><h2>${esc(host.host)}</h2><div class="host-caption">${m.cores.length} cores · ${m.gpus.length} GPUs${v?` · <span class="tag">PVE ${v.guest_count??'?'} · ${v.status==='error'?'ERR':v.status==='unconfigured'?'SETUP':v.fresh?'OK':'STALE'}</span>`:''}<br>A: Details</div></div></div><div class="metrics">${metric('CPU',fmt(m.cpu,'%'),h,'cpu','#4b91c9')}<div class="metric ${m.gpus.length>2?'overview-gpu-many':''}"><small>GPU</small>${m.gpus.length?m.gpus.map((g,i)=>`<div class="overview-gpu-row"><span>GPU ${i+1}</span><strong>${fmt(g.usage_percent,'%')}</strong></div>`).join(''):'<strong>—</strong>'}<small class="vram">${m.gpus.length>2?'A: per-GPU details':'VRAM '+vram(mainVram(m.gpus))}</small></div>${metric('Memory',fmt(m.ram,'%'),h,'ram','#379d7a')}<div class="metric temperature-pair"><small>CPU / GPU temp</small><strong>${fmt(m.cpu_temp,'°C')}<br>${fmt(m.gpu_temp,'°C')}</strong></div></div></article>`}
function sensors(temps){let rows=[];for(const [group,entries] of Object.entries(temps??{})){if(Array.isArray(entries)){for(const t of entries)if(t&&numeric(t.current))rows.push({name:t.label||group,value:t.current})}else if(entries&&typeof entries==='object'){for(const [name,list] of Object.entries(entries))if(Array.isArray(list))for(const t of list)if(t&&numeric(t.current))rows.push({name:name+' '+(t.label||''),value:t.current})}}return rows.sort((a,b)=>b.value-a.value)}
function flowReading(label,value){
 const scale=numeric(value)&&value>=1073741824?1073741824:1048576;
 return `<div class="flow-row"><span>${label}</span><strong class="flow-value">${numeric(value)?(value/scale).toFixed(2):'—'}</strong><span class="flow-unit">${scale===1073741824?'GiB/s':'MiB/s'}</span></div>`;
}
function detail(host){const m=host.metrics,v=host.virtualization;
 return `<div class="detail-grid distance-detail ${v?'pve-enabled':''}">
 <section class="panel cpu-panel usage-panel"><h3>CPU <span class="tag">Overall</span></h3><strong class="reading">${fmt(m.cpu,'%')}</strong>${bar(m.cpu,'#4b91c9')}<div class="reading-note">${m.cores.length} cores · ${fmt(m.cpu_temp,'°C')}</div></section>
 <section class="panel gpu-panel usage-panel"><h3>GPU <span class="tag">${m.gpus.length} devices</span></h3><div class="gpu-readings ${m.gpus.length>2?'many-gpus':''}" style="--gpu-count:${Math.max(1,m.gpus.length)}">${m.gpus.length?m.gpus.map((g,i)=>`<div class="gpu-reading" title="${esc(g.name??g.product_name??'GPU '+(i+1))}"><div class="gpu-load"><span>GPU ${i+1}</span><strong class="reading">${fmt(g.usage_percent,'%')}</strong></div><div class="gpu-vram">VRAM ${m.gpus.length>2?vramPercent(g):vram(g)}</div></div>`).join(''):'<strong class="reading">—</strong>'}</div></section>
 <section class="panel memory-panel usage-panel"><h3>Memory <span class="tag">RAM</span></h3><strong class="reading">${fmt(m.ram,'%')}</strong>${bar(m.ram,'#379d7a')}<div class="reading-note">${bytes(m.ram_used)} used</div><div class="reading-meta">of ${bytes(m.ram_total)}</div></section>
 <section class="panel flow-panel"><h3>Network <span class="tag">Total</span></h3>${flowReading('↓ Receive',m.rx)}${flowReading('↑ Send',m.tx)}</section>
 <section class="panel flow-panel"><h3>Disk I/O <span class="tag">Total</span></h3>${flowReading('↓ Read',m.read)}${flowReading('↑ Write',m.write)}</section>
 <section class="panel detail-shortcut"><h3>Temperatures</h3><span>CPU ${fmt(m.cpu_temp,'°C')} · GPU ${fmt(m.gpu_temp,'°C')}</span></section>
 <section class="panel detail-shortcut"><h3>Activity trails</h3><span>Open trend charts →</span></section>
 ${v?`<section class="panel pve-entry"><h3>CT / VM guests</h3><span>${v.guest_count??'Unknown'} · ${v.status==='error'?'API error':v.status==='unconfigured'?'Setup required':v.fresh?'Fresh':'Stale'} · A Open</span></section>`:''}
 </div>`;
}

const sectionLabels={cpu:'CPU',gpu:'GPU',memory:'Memory',network:'Network',disks:'Disk I/O',temperatures:'Temperatures',history:'Activity trails'};
function chartPanel(label,history,key,color,limit=100){return `<section class="panel focus-chart"><h3>${esc(label)}<span class="history-note">Last 60 updates</span></h3>${graph(history,key,color,limit)}</section>`}
function gpuHistory(history,index){return history.map(sample=>sample.gpus?.[index]??{})}
function pageItems(rows,page,size=4){const count=Math.max(1,Math.ceil(rows.length/size)),index=((page%count)+count)%count;return rows.slice(index*size,(index+1)*size)}
function itemPager(rows,page,size=4){const count=Math.max(1,Math.ceil(rows.length/size)),index=((page%count)+count)%count;return `<span class="item-pager"><button onclick="control('up')" ${count===1?'disabled':''}>↑</button> ${index+1} / ${count} <button onclick="control('down')" ${count===1?'disabled':''}>↓</button></span>`}
function focusDetail(host,section,page=0){let m=host.metrics,h=host.history;
 if(section==='cpu')return `<div class="focus-grid"><section class="panel cpu-panel"><h3>CPU overall <span class="tag">${m.cores.length} cores</span></h3><div class="instrument">${gauge(m.cpu,'#9cccf4','CPU load')}<div>${temperature(m.cpu_temp,'CPU temperature')}</div></div></section><section class="panel"><h3>Busiest four cores</h3><div class="cores">${busiest(m.cores).map(c=>`<div class="core">C${c.index+1} ${fmt(c.value,'%')}${bar(c.value,'#9cccf4')}</div>`).join('')||'No per-core data'}</div></section>${chartPanel('CPU load',h,'cpu','#4b91c9')}${chartPanel('CPU temperature',h,'cpu_temp','#aa8100',100)}</div>`;
 if(section==='gpu')return m.gpus.length?`<div class="gpu-focus-page"><div class="gpu-page-heading">GPU devices ${itemPager(m.gpus,page,2)}</div><div class="focus-gpus ${pageItems(m.gpus,page,2).length===1?'single':''}">${pageItems(m.gpus.map((g,i)=>({g,i})),page,2).map(({g,i})=>`<section class="panel gpu-panel">${gpuCard(g,i)}<div class="focus-chart"><small>GPU ${i+1} load · last 60 updates</small>${graph(gpuHistory(h,i),'load','#ce648b')}</div><div class="focus-chart"><small>VRAM usage · last 60 updates</small>${graph(gpuHistory(h,i),'vram','#9860bd')}</div></section>`).join('')}</div></div>`:'<div class="empty">No GPU data reported by this computer</div>';
 if(section==='memory')return `<div class="focus-grid"><section class="panel memory-panel"><h3>RAM usage</h3><div class="instrument">${gauge(m.ram,'#8ae1c8','RAM')}<div><div class="big">${bytes(m.ram_used)}</div><div class="mini-label">Used of ${bytes(m.ram_total)}</div><div class="mini-label">Available ${numeric(m.ram_total)&&numeric(m.ram_used)?bytes(Math.max(0,m.ram_total-m.ram_used)):'—'}</div></div></div></section><section class="panel"><h3>Swap usage</h3>${gauge(m.swap,'#ffe071','Swap')}</section>${chartPanel('RAM history',h,'ram','#379d7a')}${chartPanel('Swap history',h,'swap','#aa8100')}</div>`;
 if(section==='history')return `<div class="focus-activity">${[['CPU','cpu','#4b91c9',100],['GPU','gpu','#ce648b',100],['Memory','ram','#379d7a',100],['Download','rx','#4b91c9',null],['Upload','tx','#379d7a',null],['Disk read','read','#aa8100',null],['Disk write','write','#9860bd',null]].map(([label,key,color,max])=>`<section class="panel"><h3>${label}</h3><strong>${max===100?fmt(m[key],'%'):rate(m[key])}</strong>${graph(h,key,color,max)}<small>Last 60 updates</small></section>`).join('')}</div>`;
 if(section==='temperatures'){let rows=sensors(m.temperatures),highest=rows[0]?.value;return `<div class="focus-list"><section class="panel"><h3>Temperatures <span class="tag">${rows.length} sensors</span></h3><div class="big">Hottest ${fmt(highest,'°C')}</div><div class="mini-label">${itemPager(rows,page)}</div></section><section class="panel graphs-pair"><div>CPU temperature${graph(h,'cpu_temp','#aa8100',100)}</div><div>GPU temperature${graph(h,'gpu_temp','#ce648b',100)}</div></section><div class="item-grid">${pageItems(rows,page).map(t=>`<div class="item-card"><h4>${esc(t.name)}</h4>${temperature(t.value)}</div>`).join('')||'<div>No sensors reported</div>'}</div></div>`}
 let network=section==='network',rows=Object.entries(network?m.network?.per_nic??{}:m.disks??{}),first=network?'rx_bytes_per_s':'read_bytes_per_s',second=network?'tx_bytes_per_s':'write_bytes_per_s';
 rows.sort((a,b)=>((b[1]?.rate?.[first]??0)+(b[1]?.rate?.[second]??0))-((a[1]?.rate?.[first]??0)+(a[1]?.rate?.[second]??0)));
 let limit=Math.max(1,...rows.flatMap(([_,entry])=>[entry?.rate?.[first],entry?.rate?.[second]]).filter(numeric));
 return `<div class="focus-list"><section class="panel"><h3>${network?'Network interfaces':'Disk devices'} <span class="tag">${rows.length} ${network?'interfaces':'devices'}</span></h3><div class="io-totals"><div><small>${network?'Total download':'Total read'}</small><strong>${rate(network?m.rx:m.read)}</strong></div><div><small>${network?'Total upload':'Total write'}</small><strong>${rate(network?m.tx:m.write)}</strong></div></div><div class="mini-label">Totals include all devices ${itemPager(rows,page)}</div></section><section class="panel graphs-pair"><div>${network?'Download':'Read'}${graph(h,network?'rx':'read','#4b91c9',null)}</div><div>${network?'Upload':'Write'}${graph(h,network?'tx':'write','#379d7a',null)}</div></section><div class="item-grid">${pageItems(rows,page).map(([name,entry])=>`<div class="item-card"><h4>${esc(name)}</h4><div class="sensor">${network?'↓':'Read'} ${rate(entry?.rate?.[first])}${bar(entry?.rate?.[first],'#9cccf4',limit)}</div><div class="sensor">${network?'↑':'Write'} ${rate(entry?.rate?.[second])}${bar(entry?.rate?.[second],'#8ae1c8',limit)}</div>${network?'':`<div class="sensor item-extra">IOPS R ${fmt(entry?.rate?.read_iops)} / W ${fmt(entry?.rate?.write_iops)}</div>`}</div>`).join('')||'<div>No device data reported</div>'}</div></div>`;
}
let updating=false;
let viewKey='', renderedAt=0,lastSelection=null,lastPanel=null;
function render(s){
 const device=s.device??{},deviceName=device.name??'R36',screenKey=device.screen_key??'FN';
 document.getElementById('device-status').setAttribute('aria-label',deviceName+' handheld status');
 document.querySelectorAll('#device-status small').forEach((e,i)=>{if(i<3)e.textContent=deviceName+' '+['Temp','CPU','RAM'][i]});
 document.getElementById('exit-keys').textContent=device.exit_keys??'Select + B';
 document.getElementById('local-temp').textContent=fmt(device.temperature,'°C');
 document.getElementById('local-cpu').textContent=fmt(device.cpu,'%');
 document.getElementById('local-memory').textContent=fmt(device.memory,'%');
 document.getElementById('local-battery').textContent=numeric(device.battery)?device.battery+'%':'—';
 const charging=device.charging, plugged=device.plugged, label=charging?'Charging':plugged?(device.battery_status==='Full'?'Fully charged · plugged in':'Plugged in'):'On battery';
 document.getElementById('local-battery-box').classList.toggle('powered',Boolean(charging||plugged));
 document.getElementById('local-battery-box').setAttribute('aria-label',deviceName+' battery: '+label);
 document.getElementById('charge-icon').innerHTML=charging?'<svg viewBox="0 0 16 20" role="img" aria-label="Charging"><path d="M9 0 1 11h6l-1 9 9-12H9z" fill="currentColor"/></svg>':plugged?'<svg viewBox="0 0 20 20" role="img" aria-label="'+label+'"><path d="M6 1v5m8-5v5M4 6h12v3a6 6 0 0 1-12 0zM10 15v4" fill="none" stroke="currentColor" stroke-width="2"/></svg>':'';

 document.getElementById('screen-button').textContent=screenKey+(s.screen_off?' Wake':' Screen off');
 document.getElementById('screen-button').setAttribute('aria-label',device.name==='TrimUI'?'Turn screen off; press Y to wake':'Turn screen off; press FN to wake');
 document.body.classList.toggle('device-summary',Boolean(s.detail&&!s.focus));
 document.getElementById('connection').textContent=s.connection;
 document.getElementById('connection').className=s.connection==='Connected'?'':'error';
 document.getElementById('title').textContent=s.detail||'Hardware Monitor';
 document.getElementById('help').innerHTML=s.pve_view==='guest'?'L/R Guest · B List':s.pve_view?'<kbd>↑↓</kbd> Select · <kbd>←→</kbd> Page':s.detail?(s.focus?'<kbd>↑ ↓</kbd> Items <kbd>← →</kbd> Metric <kbd>B</kbd> Back':'<kbd>Stick / D-pad</kbd> Select <kbd>A</kbd> Open <kbd>B</kbd> Back'):'<kbd>Stick / D-pad</kbd> Select <kbd>A</kbd> Details';
 document.getElementById('summary').textContent=s.pve_view?`${s.hosts[0]?.virtualization?.status==='error'?'PVE API error · ':s.hosts[0]?.virtualization?.status==='unconfigured'?'PVE setup required · ':''}${s.hosts[0]?.virtualization?.fresh?'Fresh':'Guest data stale or not yet observed'} · ${s.hosts[0]?.virtualization?.guest_count??'Unknown'} guests`: `${s.count} online · Page ${s.page} / ${s.pages} · ${s.focus?sectionLabels[s.focus]+' · L1 / R1 switch device':s.detail?'L1 / R1 switch device · A: metric details':s.paused?'Paused · press Start to resume':'Auto · 15 seconds per page'}`;
 let root=document.getElementById('main'),key=JSON.stringify([s.detail,s.focus,s.pve_view,s.pve_page,s.pve_selected,s.pve_guest_id,s.item_page??0,s.hosts.map(h=>h.host)]),now=performance.now();
 // Metrics redraw once per second; selection responds to every event.
 if(key!==viewKey||(now-renderedAt>=1000&&s.selected===lastSelection&&s.panel===lastPanel)){root.innerHTML=s.hosts.length?(s.pve_view?PVEView.render(s.hosts[0].virtualization,s.pve_page,s.pve_selected,{esc,fmt,bytes,rate,graph},s.pve_view==='guest'):s.detail?(s.focus?focusDetail(s.hosts[0],s.focus,s.item_page??0):detail(s.hosts[0])):'<div class="overview-grid">'+s.hosts.map(h=>overview(h,s.selected)).join('')+'</div>'):'<div class="empty"><div><img src="/assets/hardware-buddy.svg" alt="">No buddies online yet<br><small>Waiting for computer monitoring data</small></div></div>';viewKey=key;renderedAt=now;root.querySelectorAll('.detail-grid>.panel').forEach((p,i)=>{p.dataset.section=Object.keys(sectionLabels)[i]??'pve';p.setAttribute('role','button');p.tabIndex=0;p.setAttribute('aria-label',p.dataset.section==='pve'?'Open PVE guest list':'Open '+sectionLabels[p.dataset.section]+' details')})}
 root.querySelectorAll('article').forEach(a=>a.classList.toggle('selected',a.dataset.host===s.selected));
 root.querySelectorAll('[data-section]').forEach(p=>{p.classList.toggle('selected',p.dataset.section===s.panel);p.setAttribute('aria-pressed',String(p.dataset.section===s.panel))});
 lastSelection=s.selected;lastPanel=s.panel;
 root.scrollTop=0;
}
function lost(){for(const id of ['local-temp','local-cpu','local-memory','local-battery'])document.getElementById(id).textContent='—';document.getElementById('charge-icon').innerHTML='';document.getElementById('local-battery-box').classList.remove('powered');document.getElementById('connection').textContent='Display connection lost';document.getElementById('connection').className='error'}
async function update(){if(updating)return;updating=true;try{let r=await fetch('/status');if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){lost()}finally{updating=false}}
async function control(action){await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})})}
document.getElementById('main').addEventListener('click',e=>{let panel=e.target.closest('[data-section]');if(panel)control(panel.dataset.section==='pve'?'pve':'focus:'+panel.dataset.section)});
const events=new EventSource('/events');events.onmessage=e=>render(JSON.parse(e.data));events.onerror=lost;
document.addEventListener('keydown',e=>{if(e.target.closest('button')&&(e.key==='Enter'||e.key===' '))return;const actions={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'detail',Backspace:'back',Escape:'back',PageUp:'previous',PageDown:'next',' ':'toggle',f:'screen',F:'screen'};if(actions[e.key]){e.preventDefault();const panel=e.target.closest('[data-section]');control(e.key==='Enter'&&panel?(panel.dataset.section==='pve'?'pve':'focus:'+panel.dataset.section):actions[e.key])}});
update();
</script></html>
