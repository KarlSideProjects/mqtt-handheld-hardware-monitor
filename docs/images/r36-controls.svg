<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1330" viewBox="0 0 1500 1330"><title>R36 MAX 2按鍵操作</title><desc>實機截圖與去背機身的操作圖解。所有標註均為本專案監控功能。</desc><style>text{font-family:"Noto Sans CJK TC",sans-serif}</style><rect width="100%" height="100%" fill="#f7f9fc"/><text x="50" y="67" font-size="42" fill="#243448" font-weight="700">R36 MAX 2｜監控按鍵圖</text><text x="50" y="115" font-size="26" fill="#243448" font-weight="400">進入 Hardware Monitor 後，依圖上的編號操作。</text><image href="r36max2-cutout.png" x="430" y="160" width="640" height="696" preserveAspectRatio="none"/><rect x="554.8" y="198.28" width="412.8" height="341.04" fill="#101825"/><image href="r36-dashboard.png" x="554.8" y="198.28" width="412.8" height="341.04" preserveAspectRatio="none"/><circle cx="655.28" cy="751.6" r="24" fill="none" stroke="#1266d6" stroke-width="5"/><path d="M655.28,751.6 l-34,30" stroke="#1266d6" stroke-width="3"/><circle cx="621.28" cy="781.6" r="23" fill="#1266d6" stroke="white" stroke-width="3"/><text x="613.28" y="790.6" font-size="27" fill="white" font-weight="700">1</text><circle cx="636.08" cy="630.4960000000001" r="24" fill="none" stroke="#1266d6" stroke-width="5"/><path d="M636.08,630.4960000000001 l-34,30" stroke="#1266d6" stroke-width="3"/><circle cx="602.08" cy="660.4960000000001" r="23" fill="#1266d6" stroke="white" stroke-width="3"/><text x="594.08" y="669.4960000000001" font-size="27" fill="white" font-weight="700">1</text><circle cx="886.96" cy="752.2959999999999" r="24" fill="none" stroke="#1266d6" stroke-width="5"/><path d="M886.96,752.2959999999999 l-34,30" stroke="#1266d6" stroke-width="3"/><circle cx="852.96" cy="782.2959999999999" r="23" fill="#1266d6" stroke="white" stroke-width="3"/><text x="844.96" y="791.2959999999999" font-size="27" fill="white" font-weight="700">1</text><circle cx="934.96" cy="629.104" r="24" fill="none" stroke="#167c5a" stroke-width="5"/><path d="M934.96,629.104 l40,-18" stroke="#167c5a" stroke-width="3"/><circle cx="974.96" cy="611.104" r="23" fill="#167c5a" stroke="white" stroke-width="3"/><text x="966.96" y="620.104" font-size="27" fill="white" font-weight="700">2</text><circle cx="900.4" cy="667.384" r="24" fill="none" stroke="#a44919" stroke-width="5"/><path d="M900.4,667.384 l38,20" stroke="#a44919" stroke-width="3"/><circle cx="938.4" cy="687.384" r="23" fill="#a44919" stroke="white" stroke-width="3"/><text x="930.4" y="696.384" font-size="27" fill="white" font-weight="700">3</text><circle cx="762.1600000000001" cy="712.624" r="24" fill="none" stroke="#8a43c6" stroke-width="5"/><path d="M762.1600000000001,712.624 l-40,10" stroke="#8a43c6" stroke-width="3"/><circle cx="722.1600000000001" cy="722.624" r="23" fill="#8a43c6" stroke="white" stroke-width="3"/><text x="714.1600000000001" y="731.624" font-size="27" fill="white" font-weight="700">4</text><circle cx="810.16" cy="671.56" r="24" fill="none" stroke="#176c7d" stroke-width="5"/><path d="M810.16,671.56 l40,-8" stroke="#176c7d" stroke-width="3"/><circle cx="850.16" cy="663.56" r="23" fill="#176c7d" stroke="white" stroke-width="3"/><text x="842.16" y="672.56" font-size="27" fill="white" font-weight="700">5</text><circle cx="714.1600000000001" cy="670.864" r="24" fill="none" stroke="#c02e4e" stroke-width="5"/><path d="M714.1600000000001,670.864 l-40,-12" stroke="#c02e4e" stroke-width="3"/><circle cx="674.1600000000001" cy="658.864" r="23" fill="#c02e4e" stroke="white" stroke-width="3"/><text x="666.1600000000001" y="667.864" font-size="27" fill="white" font-weight="700">6</text><rect x="55" y="866" width="670" height="96" rx="14" fill="white" stroke="#d6deea"/><circle cx="90" cy="906" r="23" fill="#1266d6" stroke="white" stroke-width="3"/><text x="82" y="915" font-size="27" fill="white" font-weight="700">1</text><text x="130" y="902" font-size="29" fill="#243448" font-weight="700">方向鍵／搖桿</text><text x="130" y="939" font-size="24" fill="#243448" font-weight="400">方向鍵／左：導覽；右：90° 旋轉</text><rect x="780" y="866" width="670" height="96" rx="14" fill="white" stroke="#d6deea"/><circle cx="815" cy="906" r="23" fill="#167c5a" stroke="white" stroke-width="3"/><text x="807" y="915" font-size="27" fill="white" font-weight="700">2</text><text x="855" y="902" font-size="29" fill="#243448" font-weight="700">A｜開啟詳細頁</text><text x="855" y="939" font-size="24" fill="#243448" font-weight="400">再按一次，查看選定資訊卡</text><rect x="55" y="974" width="670" height="96" rx="14" fill="white" stroke="#d6deea"/><circle cx="90" cy="1014" r="23" fill="#a44919" stroke="white" stroke-width="3"/><text x="82" y="1023" font-size="27" fill="white" font-weight="700">3</text><text x="130" y="1010" font-size="29" fill="#243448" font-weight="700">B｜返回</text><text x="130" y="1047" font-size="24" fill="#243448" font-weight="400">單項頁 → 詳細頁 → 總覽</text><rect x="780" y="974" width="670" height="96" rx="14" fill="white" stroke="#d6deea"/><circle cx="815" cy="1014" r="23" fill="#8a43c6" stroke="white" stroke-width="3"/><text x="807" y="1023" font-size="27" fill="white" font-weight="700">4</text><text x="855" y="1010" font-size="29" fill="#243448" font-weight="700">FN｜關屏／喚醒</text><text x="855" y="1047" font-size="24" fill="#243448" font-weight="400">再按一次恢復；MQTT 持續接收</text><rect x="55" y="1082" width="670" height="96" rx="14" fill="white" stroke="#d6deea"/><circle cx="90" cy="1122" r="23" fill="#176c7d" stroke="white" stroke-width="3"/><text x="82" y="1131" font-size="27" fill="white" font-weight="700">5</text><text x="130" y="1118" font-size="29" fill="#243448" font-weight="700">Start｜輪播</text><text x="130" y="1155" font-size="24" fill="#243448" font-weight="400">在總覽暫停或恢復輪播</text><rect x="780" y="1082" width="670" height="96" rx="14" fill="white" stroke="#d6deea"/><circle cx="815" cy="1122" r="23" fill="#c02e4e" stroke="white" stroke-width="3"/><text x="807" y="1131" font-size="27" fill="white" font-weight="700">6</text><text x="855" y="1118" font-size="29" fill="#243448" font-weight="700">Select + B｜退出</text><text x="855" y="1155" font-size="24" fill="#243448" font-weight="400">同時按住，回到遊戲選單</text><text x="55" y="1250" font-size="26" fill="#243448" font-weight="700">L1／R1（上緣／機背肩鍵）：總覽翻頁；詳細頁切換上一台／下一台。</text><text x="55" y="1294" font-size="23" fill="#607085" font-weight="400">機身為商品照片去背示意，螢幕嵌入實機截圖；不代表原廠內建此功能。</text></svg>