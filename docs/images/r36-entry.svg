<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2080" viewBox="0 0 1400 2080"><title>R36 MAX 2開啟監控面板</title><desc>實機截圖與去背機身的操作圖解。所有標註均為本專案監控功能。</desc><style>text{font-family:"Noto Sans CJK TC",sans-serif}</style><rect width="100%" height="100%" fill="#f7f9fc"/><text x="45" y="64" font-size="39" fill="#243448" font-weight="700">R36 MAX 2｜從遊戲選單進入監控</text><text x="45" y="109" font-size="24" fill="#243448" font-weight="400">先完成安裝。下列選單與監控頁均取自對應實機；機身為去背合成示意。</text><circle cx="70" cy="180" r="23" fill="#1266d6" stroke="white" stroke-width="3"/><text x="62" y="189" font-size="27" fill="white" font-weight="700">1</text><text x="110" y="190" font-size="32" fill="#243448" font-weight="700">在遊戲機系統選單選 PORTS</text><image href="r36max2-cutout.png" x="80" y="242" width="420" height="457" preserveAspectRatio="none"/><rect x="161.9" y="267.135" width="270.90000000000003" height="223.93" fill="#111"/><image href="r36-system-ports.png" x="161.9" y="267.135" width="270.90000000000003" height="223.93" preserveAspectRatio="none"/><image href="r36-system-ports.png" x="610" y="235" width="720" height="540" preserveAspectRatio="none"/><rect x="793.6" y="326.8" width="352.8" height="351.0" rx="8" fill="none" stroke="#ffdf37" stroke-width="7"/><text x="45" y="782" font-size="27" fill="#1266d6" font-weight="700">左右選 PORTS，按 A</text><circle cx="70" cy="820" r="23" fill="#1266d6" stroke="white" stroke-width="3"/><text x="62" y="829" font-size="27" fill="white" font-weight="700">2</text><text x="110" y="830" font-size="32" fill="#243448" font-weight="700">選笑臉晶片 Hardware Monitor</text><image href="r36max2-cutout.png" x="80" y="882" width="420" height="457" preserveAspectRatio="none"/><rect x="161.9" y="907.135" width="270.90000000000003" height="223.93" fill="#111"/><image href="r36-port-monitor.png" x="161.9" y="907.135" width="270.90000000000003" height="223.93" preserveAspectRatio="none"/><image href="r36-port-monitor.png" x="610" y="875" width="720" height="540" preserveAspectRatio="none"/><rect x="847.6" y="1031.6" width="244.8" height="253.79999999999998" rx="8" fill="none" stroke="#ffdf37" stroke-width="7"/><text x="45" y="1422" font-size="27" fill="#1266d6" font-weight="700">方向鍵選圖示，再按 A</text><circle cx="70" cy="1460" r="23" fill="#1266d6" stroke="white" stroke-width="3"/><text x="62" y="1469" font-size="27" fill="white" font-weight="700">3</text><text x="110" y="1470" font-size="32" fill="#243448" font-weight="700">進入監控總覽</text><image href="r36max2-cutout.png" x="80" y="1522" width="420" height="457" preserveAspectRatio="none"/><rect x="161.9" y="1547.135" width="270.90000000000003" height="223.93" fill="#111"/><image href="r36-dashboard.png" x="161.9" y="1547.135" width="270.90000000000003" height="223.93" preserveAspectRatio="none"/><image href="r36-dashboard.png" x="610" y="1515" width="720" height="540" preserveAspectRatio="none"/><text x="45" y="2062" font-size="27" fill="#1266d6" font-weight="700">方向鍵選電腦，按 A 查看詳細頁</text></svg>